trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: pr
    displayName: Pull Request
    condition: "eq(variables['Build.Reason'], 'PullRequest')"
    variables:
      - group: snowflake-credentials
    jobs:
      - job: pr
        displayName: Run smoke tests on Pull Request
        steps:
          - script: pip install snowflake-cli
            displayName: Install Snowflake CLI

          - script: |
              mkdir -p ~/.snowflake
              cat > ~/.snowflake/config.toml <<'TOML'
              [connections.default]
              account = "$(SNOWFLAKE_ACCOUNT)"
              user = "$(SNOWFLAKE_USER)"
              password = "$(SNOWFLAKE_PASSWORD)"
              TOML
              chmod 600 ~/.snowflake/config.toml
            displayName: Configure Snowflake CLI

          - script: bash scripts/smoke_test.sh dev
            displayName: Run Smoke Tests on Dev


  - stage: Deploy_Dev
    displayName: Deploy to Dev
    dependsOn: pr
    condition: and(
      in(dependencies.pr.result, 'Succeeded', 'Skipped'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: snowflake-credentials
    jobs:
      - job: deploy_dev
        displayName: Deploy to Dev
        steps:
          - script: pip install snowflake-cli
            displayName: Install Snowflake CLI

          - script: |
              mkdir -p ~/.snowflake
              cat > ~/.snowflake/config.toml <<'TOML'
              [connections.default]
              account = "$(SNOWFLAKE_ACCOUNT)"
              user = "$(SNOWFLAKE_USER)"
              password = "$(SNOWFLAKE_PASSWORD)"
              TOML
              chmod 600 ~/.snowflake/config.toml
            displayName: Configure Snowflake CLI

          - script: bash scripts/deploy.sh dev
            displayName: Deploy to Dev schema

  - stage: Deploy_Test
    displayName: Deploy to Test    
    dependsOn: Deploy_Dev
    condition: and(
      in(dependencies.Deploy_Dev.result, 'Succeeded'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: snowflake-credentials
    jobs:
      - deployment: deploy_test
        displayName: Deploy to Test
        environment: test
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: pip install snowflake-cli
                  displayName: Install Snowflake CLI

                - script: |
                    mkdir -p ~/.snowflake
                    cat > ~/.snowflake/config.toml <<'TOML'
                    [connections.default]
                    account = "$(SNOWFLAKE_ACCOUNT)"
                    user = "$(SNOWFLAKE_USER)"
                    password = "$(SNOWFLAKE_PASSWORD)"
                    TOML
                    chmod 600 ~/.snowflake/config.toml
                  displayName: Configure Snowflake CLI

                - script: bash scripts/deploy.sh test
                  displayName: Deploy to Test schema

  - stage: Deploy_Prod
    displayName: Deploy to Prod
    dependsOn: Deploy_Test
    condition: and(
      in(dependencies.Deploy_Test.result, 'Succeeded'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: snowflake-credentials
    jobs:
      - deployment: deploy_prod
        displayName: Deploy to Prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: pip install snowflake-cli
                  displayName: Install Snowflake CLI

                - script: |
                    mkdir -p ~/.snowflake
                    cat > ~/.snowflake/config.toml <<'TOML'
                    [connections.default]
                    account = "$(SNOWFLAKE_ACCOUNT)"
                    user = "$(SNOWFLAKE_USER)"
                    password = "$(SNOWFLAKE_PASSWORD)"
                    TOML
                    chmod 600 ~/.snowflake/config.toml
                  displayName: Configure Snowflake CLI

                - script: bash scripts/deploy.sh prod
                  displayName: Deploy to Prod schema
